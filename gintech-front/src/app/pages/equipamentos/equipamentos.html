<div>
  <!-- Cabeçalho da Página -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Gestão de Equipamentos</h1>
    <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 font-medium transition-colors shadow-sm">
      + Novo Equipamento
    </button>
  </div>

  <!-- Tabela -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-600">
          <th class="p-4 font-medium">ID</th>
          <th class="p-4 font-medium">Nome / Modelo</th>
          <th class="p-4 font-medium">Património</th>
          <th class="p-4 font-medium">Status</th>
          <th class="p-4 font-medium text-right">Ações</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 text-sm text-gray-800">
        
        <!-- Loop moderno do Angular -->
        @for (item of equipamentos; track item.id) {
          <tr class="hover:bg-gray-50 transition-colors">
            <td class="p-4 text-gray-500">{{ item.id }}</td>
            <td class="p-4 font-medium">{{ item.nome }}</td>
            <td class="p-4">{{ item.patrimonio }}</td>
            <td class="p-4">
              <!-- Estilização dinâmica baseada no status -->
              <span class="px-2 py-1 rounded-full text-xs font-medium"
                    [class.bg-green-100]="item.status === 'Ativo'" [class.text-green-800]="item.status === 'Ativo'"
                    [class.bg-yellow-100]="item.status === 'Em Manutenção'" [class.text-yellow-800]="item.status === 'Em Manutenção'"
                    [class.bg-red-100]="item.status === 'Inativo'" [class.text-red-800]="item.status === 'Inativo'">
                {{ item.status }}
              </span>
            </td>
            <td class="p-4 text-right space-x-3">
              <button class="text-blue-600 hover:text-blue-800 font-medium transition-colors">Editar</button>
              <button class="text-red-600 hover:text-red-800 font-medium transition-colors">Excluir</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="p-8 text-center text-gray-500">Nenhum equipamento registado.</td>
          </tr>
        }

      </tbody>
    </table>
  </div>
</div>
